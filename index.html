<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente Inteligente - Núcleo Avançado</title>
  <meta name="theme-color" content="#000000">
  <style>
    :root { 
      --bg: #000000; --card: #0a0a0c; --border: #1f1f23; 
      --accent: #3b82f6; --text: #f3f4f6; --muted: #9ca3af; 
    }
    * { box-sizing: border-box; }
    body { 
      margin: 0; font-family: system-ui, sans-serif; background: var(--bg); 
      color: var(--text); display: flex; flex-direction: column; height: 100vh; 
    }
    #main-screen { 
      display: flex; flex-direction: column; padding: 16px; 
      gap: 12px; height: 100%; overflow: hidden; 
    }
    .hud { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hud-box { 
      background: var(--card); border: 1px solid var(--border); 
      border-radius: 12px; padding: 12px; font-size: 13px; color: var(--muted);
    }
    .hud-box strong { display: block; font-size: 18px; color: #ffffff; margin-top: 4px; }
    #log-area { 
      flex: 1; background: var(--card); border: 1px solid var(--border); 
      border-radius: 12px; padding: 16px; overflow-y: auto; font-size: 15px; line-height: 1.6; 
    }
    .msg { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .msg-jarvis { color: #ffffff; border-left: 3px solid var(--accent); padding-left: 10px; }
    .msg-sys { color: var(--muted); font-size: 13px; }
    .input-bar { display: flex; gap: 8px; }
    input, button { 
      background: var(--card); border: 1px solid var(--border); color: #fff; 
      padding: 14px; border-radius: 12px; font-size: 16px; 
    }
    input { flex: 1; }
    button { background: var(--accent); border: none; font-weight: bold; cursor: pointer; }
    button:active { transform: scale(0.98); }
    .btn-sec { background: #18181b; }
  </style>
</head>
<body>

  <div id="main-screen">
    <div class="hud">
      <div class="hud-box">Saldo Líquido<strong id="hud-saldo">R$ 0,00</strong></div>
      <div class="hud-box">Agenda Ativa<strong id="hud-agenda">0 clientes</strong></div>
    </div>

    <div style="display:flex; gap:8px; justify-content: flex-end;">
      <button class="btn-sec" onclick="configurarChaveIA()">Configurar API Gemini</button>
      <button class="btn-sec" onclick="gerarRelatorio()">Resumo Geral</button>
    </div>

    <div id="log-area"></div>

    <div class="input-bar">
      <input type="text" id="cmd-input" placeholder="Comandar, pesquisar ou relatar..." onkeypress="if(event.key==='Enter') processarComando()">
      <button onclick="processarComando()">Enviar</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDxqbwzst9XYD460orJQE503mQbTvtLE_U",
      authDomain: "jarvis-88c9f.firebaseapp.com",
      projectId: "jarvis-88c9f",
      storageBucket: "jarvis-88c9f.firebasestorage.app",
      messagingSenderId: "665385907551",
      appId: "1:665385907551:web:bc8946b3a421c1c80af2ea",
      measurementId: "G-ZXYXYDK2W4"
    };

    const app = initializeApp(firebaseConfig);
    const dbFirestore = getFirestore(app);

    const DB_KEY = "jarvis_ultimate_core_v4";
    let db = JSON.parse(localStorage.getItem(DB_KEY)) || {
      apiKey: "",
      meuNome: "Senhor",
      financas: [],      
      agendamentos: [],  
      notificacoes: [],  
      conhecimento: []   
    };

    function salvarDB() {
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      atualizarHUD();
      sincronizarRemoto();
    }

    async function sincronizarRemoto() {
      try {
        await setDoc(doc(dbFirestore, "sistema", "dados"), db);
      } catch (e) {
        console.log("Sincronização em segundo plano.");
      }
    }

    async function carregarRemoto() {
      try {
        const docSnap = await getDoc(doc(dbFirestore, "sistema", "dados"));
        if (docSnap.exists()) {
          db = docSnap.data();
          localStorage.setItem(DB_KEY, JSON.stringify(db));
          atualizarHUD();
        }
      } catch (e) {
        console.log("Usando armazenamento local.");
      }
    }

    const swCode = `
      const CACHE_NAME = 'jarvis-ultimate-core-v1';
      self.addEventListener('install', (e) => {
        self.skipWaiting();
        e.waitUntil(caches.open(CACHE_NAME).then((c) => c.addAll(['/'])));
      });
      self.addEventListener('activate', (e) => {
        e.waitUntil(caches.keys().then((keys) => Promise.all(keys.map((k) => k !== CACHE_NAME ? caches.delete(k) : null))).then(() => self.clients.claim()));
      });
      self.addEventListener('fetch', (e) => {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
      });
    `;

    if ('serviceWorker' in navigator) {
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).then((reg) => {
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          nw.addEventListener('statechange', () => {
            if (nw.state === 'activated') {
              console.log("Nova versão pronta. Digite 'atualizar' para aplicar.");
            }
          });
        });
      });
    }

    function falar(texto) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto.replace(/<[^>]*>/g, ''));
      utterance.lang = 'pt-BR';
      utterance.rate = 1.1;
      window.speechSynthesis.speak(utterance);
    }

    function iniciarSistema() {
      atualizarHUD();
      carregarRemoto();
      const saudacao = "Núcleo avançado online, Senhor. Modos de camuflagem, varredura segura e síntese de voz ativos.";
      log(saudacao, "jarvis");
      falar(saudacao);
    }

    function atualizarHUD() {
      const saldo = db.financas.reduce((acc, item) => item.tipo === 'entrada' ? acc + item.valor : acc - item.valor, 0);
      const ativos = db.agendamentos.filter(a => a.status === 'ativo').length;
      document.getElementById('hud-saldo').innerText = `R$ ${saldo.toFixed(2).replace('.', ',')}`;
      document.getElementById('hud-agenda').innerText = `${ativos} clientes`;
    }

    function log(html, tipo = "jarvis") {
      const area = document.getElementById('log-area');
      const div = document.createElement('div');
      div.className = `msg msg-${tipo}`;
      div.innerHTML = tipo === "jarvis" ? `<strong>Jarvis:</strong> ${html}` : html;
      area.appendChild(div);
      area.scrollTop = area.scrollHeight;
    }

    function configurarChaveIA() {
      const chave = prompt("Insira sua chave API Gemini:", db.apiKey);
      if (chave !== null) {
        db.apiKey = chave.trim();
        salvarDB();
        log("Chave configurada com sucesso.", "sys");
        falar("Chave conectada.");
      }
    }

    function processarNotificacao(app, texto) {
      const data = new Date().toISOString();
      db.notificacoes.push({ app, texto, data });
      const txtLower = texto.toLowerCase();

      if (txtLower.includes('pix') || txtLower.includes('r$')) {
        const matchValor = texto.match(/r\$\s?(\d+[.,]\d{2})/i);
        if (matchValor) {
          const valor = parseFloat(matchValor[1].replace(',', '.'));
          if (!txtLower.includes('jackson')) {
            const isEntrada = txtLower.includes('recebeu') || txtLower.includes('recebido');
            db.financas.push({
              tipo: isEntrada ? 'entrada' : 'saida',
              valor: valor,
              desc: `${app}: ${texto}`,
              data
            });
          }
        }
      }

      if (txtLower.includes('agendou') || txtLower.includes('marcou')) {
        db.agendamentos.push({ cliente: texto, info: app, status: 'ativo', data });
      }

      salvarDB();
    }

    async function modoCamuflagemVarredura(entrada) {
      log("Executando protocolo de varredura camuflada...", "sys");
      try {
        if (entrada.startsWith('http')) {
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 10000);
          
          const res = await fetch(`https://r.jina.ai/${encodeURIComponent(entrada)}`, { signal: controller.signal });
          clearTimeout(timeout);
          const conteudo = await res.text();
          const trecho = conteudo.slice(0, 3000);

          db.conhecimento.push({ fonte: entrada, resumo: trecho.slice(0, 200), data: new Date().toISOString() });
          salvarDB();

          if (db.apiKey) {
            await consultarGemini(`Analise de forma puramente factual e discreta o conteúdo extraído:\n\n${trecho}`);
          } else {
            const msgExtraida = "Dados extraídos com sucesso em modo invisível.";
            log(msgExtraida);
            falar(msgExtraida);
          }
          return;
        }

        if (db.apiKey) {
          await consultarGemini(`Responda de forma direta e formal sobre: ${entrada}`);
        } else {
          const wikiRes = await fetch(`https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(entrada)}`);
          if (wikiRes.ok) {
            const wikiData = await wikiRes.json();
            log(`<strong>Consulta Segura:</strong> ${wikiData.extract}`);
            falar(wikiData.extract);
          } else {
            const msgFinal = "Varredura concluída. Dados armazenados com segurança.";
            log(msgFinal);
            falar(msgFinal);
          }
        }
      } catch (e) {
        log("Protocolo finalizado silenciosamente.", "sys");
      }
    }

    async function consultarGemini(promptTexto) {
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${db.apiKey}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptTexto }] }] })
        });
        const data = await response.json();
        const resposta = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sem retorno.";
        log(resposta.replace(/\n/g, '<br>'));
        falar(resposta);
      } catch (err) {
        log("Erro na comunicação neural.", "sys");
      }
    }

    function processarComando() {
      const input = document.getElementById('cmd-input');
      const cmd = input.value.trim();
      if (!cmd) return;

      log(`<strong>Senhor:</strong> ${cmd}`, "sys");
      input.value = '';
      const low = cmd.toLowerCase();

      if (low === 'atualizar') {
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
          log("Aplicando atualização...", "sys");
          setTimeout(() => { window.location.reload(); }, 1000);
        }
      } else if (low === 'como estou?' || low === 'resumo') {
        gerarRelatorio();
      } else {
        modoCamuflagemVarredura(cmd);
      }
    }

    function gerarRelatorio() {
      const entradas = db.financas.filter(f => f.tipo === 'entrada').reduce((a, b) => a + b.valor, 0);
      const saidas = db.financas.filter(f => f.tipo === 'saida').reduce((a, b) => a + b.valor, 0);
      const ativos = db.agendamentos.filter(a => a.status === 'ativo').length;

      const relatorio = `
        <strong>Status do Sistema:</strong><br>
        • Saldo: R$ ${(entradas - saidas).toFixed(2)}<br>
        • Agenda: ${ativos} clientes ativos<br>
        • Registros de Conhecimento: ${db.conhecimento.length}
      `;
      log(relatorio);
      falar(`Saldo de ${(entradas - saidas).toFixed(2)} reais com ${ativos} clientes na agenda.`);
    }

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const app = params.get('app');
      const msg = params.get('msg');
      if (app && msg) {
        processarNotificacao(decodeURIComponent(app), decodeURIComponent(msg));
        window.history.replaceState({}, document.title, window.location.pathname);
      }
      iniciarSistema();
    });
  </script>
</body>
</html>
